name: Monitoramento de Site

on:
  workflow_dispatch: # Permite iniciar manualmente
  schedule:
    # Roda a cada 90 minutos
    - cron: '*/90 * * * *'

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checar o código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium schedule slack_sdk

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Executar o script de monitoramento
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: python monitor_uma_vez.py