name: Monitoramento de Site

on:
  workflow_dispatch: # Permite iniciar manualmente pela interface do GitHub
  schedule:
    # Roda 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 (UTC)
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    # Roda 01:30, 04:30, 07:30, 10:30, 13:30, 16:30, 19:30, 22:30 (UTC)
    - cron: '30 1,4,7,10,13,16,19,22 * * *'

jobs:
  run-monitor:
    # Usa a versão mais recente do Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o seu código (monitor_uma_vez.py e requirements.txt)
      - name: Checar o código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Pode usar 3.10, 3.11, 3.12...

      # 3. Instala as bibliotecas do seu requirements.txt
      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # 4. Instala o Navegador Google Chrome
      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # 5. Instala o ChromeDriver (o "motor" do Selenium)
      - name: Instalar ChromeDriver
        run: |
          CHROME_DRIVER_VERSION=$(curl -sS https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE)
          wget -O chromedriver.zip "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_DRIVER_VERSION/linux64/chromedriver-linux64.zip"
          sudo unzip chromedriver.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver-linux64/chromedriver
          # Cria um link simbólico para que o Selenium o encontre
          sudo ln -s /usr/local/bin/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver

      # 6. Executa seu script
      - name: Executar o script de monitoramento
        env:
          # Esta é a parte que "injeta" seus segredos no script
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: python monitor_uma_vez.py