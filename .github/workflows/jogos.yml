name: Verificar Jogos Femininos

on:
  workflow_dispatch: # Permite iniciar manualmente pela interface do GitHub
  schedule:
    # Agendamento: Roda a cada 10 minutos
    - cron: '*/10 * * * *'

jobs:
  run-checker:
    # Usa a versão mais recente do Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o seu código (incluindo o novo verificar_jogos.py)
      - name: Checar o código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala as bibliotecas (selenium, slack_sdk, e requests)
      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Executa o seu novo script de verificação de jogos
      - name: Executar o script de verificação de jogos
        env:
          # Usa os mesmos Secrets que você já configurou!
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: python verificar_jogos.py